spring:
  cloud:
    aws:
      s3:
        bucket: opm-socket-chat-files
      region:
        static: eu-west-3
      credentials:
        profile:
          name: my-dev-profile
  application:
    name: backend
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.eu-west-3.amazonaws.com/eu-west-3_LYahNhlOQ
  datasource:
    url: jdbc:h2:mem:chatdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB

server:
  port: 8080